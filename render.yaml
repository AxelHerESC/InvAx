services:
  - type: web
    name: invax
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/listo
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INVENTARIO_ADMIN_PASSWORD
        sync: false
      - key: INVENTARIO_VENDEDOR_PASSWORD
        sync: false
      - key: INVENTARIO_AUTHKEY
        generateValue: true
      - key: INVENTARIO_TOKEN_SECRET
        generateValue: true
